name: PStudio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install pinned Three.js runtime dependencies for renderer smoke tests
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund three@0.188.0 three-mesh-bvh@0.9.18

      - name: Run Python regression tests (including C++17 compile tests)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run JavaScript regression tests
        run: node --test tests/*.test.js
