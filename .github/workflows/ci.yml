name: PStudio checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install pinned Three.js runtime dependencies for renderer smoke tests
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Run Python regression tests (including C++17 compile tests)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Configure optional native SDL3 GPU backend (compile-only)
        run: >-
          cmake -S . -B build/native-gpu
          -DPSTUDIO_BUILD_NATIVE_GPU_BACKEND=ON
          -DSDL_SHARED=OFF
          -DSDL_STATIC=ON
          -DSDL_TESTS=OFF
          -DSDL_EXAMPLES=OFF
          -DSDL_INSTALL=OFF
          -DSDL_UNIX_CONSOLE_BUILD=ON
          -DSDL_X11=OFF
          -DSDL_WAYLAND=OFF

      - name: Compile Vulkan, Direct3D 12 and Metal SDL3 adapter (no device access)
        run: cmake --build build/native-gpu --target pstudio_native_gpu_backend --parallel 2

      - name: Check TSL CSM shadow module syntax
        run: node --check static/pstudio_rendering_csm_tsl.mjs

      - name: Check TSL terrain and foliage surface module syntax
        run: node --check static/pstudio_rendering_surface_tsl.mjs

      - name: Check TSL water module syntax
        run: node --check static/pstudio_rendering_water_tsl.mjs

      - name: Check TSL clustered lighting module syntax
        run: node --check static/pstudio_rendering_clustered_lighting_tsl.mjs

      - name: Check TSL spherical harmonics module syntax
        run: node --check static/pstudio_rendering_gi_tsl.mjs

      - name: Check TSL NPR Toon module syntax
        run: node --check static/pstudio_rendering_toon_tsl.mjs

      - name: Check production 3D engine syntax
        run: node --check static/pstudio_3d_engine.js

      - name: Run JavaScript regression tests
        run: node --test tests/*.test.js
