<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>PStudio Game</title>
<style>
:root{color-scheme:dark;background:#080d16;color:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080d16}
#player-shell{position:fixed;inset:0;display:flex;flex-direction:column;background:#080d16}
#player-bar{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#111827;border-bottom:1px solid #334155}
#player-title{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player-actions{margin-left:auto;display:flex;gap:8px}
.player-button{border:1px solid #475569;border-radius:7px;background:#1e293b;color:#f8fafc;padding:7px 12px;font-size:12px;font-weight:650}
.player-button.primary{background:#e2e8f0;color:#111827;border-color:#fff}
.player-button:disabled{opacity:.5}
#game-stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:#080d16;touch-action:none}
#game-canvas,#game-3d-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
#game-3d-canvas{display:none}
#game-hud-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#game-ui-overlay{position:absolute;inset:0;pointer-events:none;z-index:6}
#game-status{height:24px;flex:0 0 24px;padding:3px 10px;background:#111827;color:#94a3b8;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.touch-controls{display:none;position:absolute;inset:0;z-index:10;pointer-events:none}
.touch-controls.active{display:block}
.touch-joystick{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(25px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:#0f172a99;border:1px solid #cbd5e155;pointer-events:auto;touch-action:none}
.touch-joystick-knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#cbd5e180;border:1px solid #f8fafcaa}
.touch-jump{position:absolute;right:max(28px,env(safe-area-inset-right));bottom:max(40px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:1px solid #f8fafc88;background:#475569cc;color:#fff;font-weight:800;pointer-events:auto;touch-action:none}
#player-errors{position:absolute;left:12px;right:12px;top:12px;z-index:20;max-height:32%;overflow:auto;padding:10px;background:#7f1d1dcc;border:1px solid #fca5a5;border-radius:8px;color:#fff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
@media(max-width:600px){#player-bar{height:42px;flex-basis:42px;padding:0 9px}.player-button{padding:6px 9px}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="player-shell">
  <header id="player-bar">
    <span id="player-title">PStudio Game</span>
    <nav id="player-actions">
      <button class="player-button primary" id="engine-play" type="button">Play</button>
      <button class="player-button" id="engine-stop" type="button" disabled>Stop</button>
    </nav>
  </header>
  <main id="game-stage">
    <canvas id="game-canvas" width="960" height="540" aria-label="Game canvas"></canvas>
    <canvas id="game-3d-canvas" width="960" height="540" aria-label="3D game canvas"></canvas>
    <canvas id="game-hud-canvas" width="960" height="540" aria-hidden="true"></canvas>\n    <output id="camera-zoom-level" hidden>100%</output>
    <div id="game-ui-overlay"></div>
    <div class="touch-controls" id="touch-controls" aria-hidden="true">
      <div class="touch-joystick" id="touch-joystick"><div class="touch-joystick-knob" id="touch-joystick-knob"></div></div>
      <button class="touch-jump" id="touch-jump" type="button">JUMP</button>
    </div>
    <pre id="player-errors" hidden></pre>
  </main>
  <footer id="game-status">Loading game…</footer>
</div>
<textarea id="code" hidden spellcheck="false"></textarea>
<div id="output" hidden></div>
<script type="module" src="./static/pstudio_player.js"></script>
</body>
</html>
